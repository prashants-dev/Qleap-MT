<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>Create Account</h1>
      <p>Please fill in your details to register.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <!-- Username Field -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
          class="form-control"
          [class.error]="username?.invalid && username?.touched"
        />
        <small class="error-message" *ngIf="username?.invalid && username?.touched">
          Username is required (min 3 characters)
        </small>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Enter email"
          class="form-control"
          [class.error]="email?.invalid && email?.touched"
        />
        <small class="error-message" *ngIf="email?.invalid && email?.touched">
          Valid email required
        </small>
      </div>

      <!-- Role Field -->
      <div class="form-group">
        <label>Select Role</label>
        <select 
          formControlName="role"
          class="form-control"
          [class.error]="role?.invalid && role?.touched"
          [disabled]="isLoadingRoles"
        >
          <option value="">
            {{ isLoadingRoles ? 'Loading roles...' : '-- Choose Role --' }}
          </option>
          <option *ngFor="let roleItem of roles" [value]="roleItem.name">
            {{ roleItem.name }}
          </option>
        </select>
        <small class="error-message" *ngIf="role?.invalid && role?.touched">
          Role is required
        </small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="form-control"
          [class.error]="password?.invalid && password?.touched"
        />
        <small class="error-message" *ngIf="password?.invalid && password?.touched">
          Password must be at least 6 characters
        </small>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm password"
          class="form-control"
          [class.error]="confirmPassword?.invalid && confirmPassword?.touched"
        />
        <small class="error-message" *ngIf="confirmPassword?.hasError('required') && confirmPassword?.touched">
          Confirm Password is required
        </small>
        <small class="error-message" *ngIf="registerForm.hasError('mismatch') && confirmPassword?.touched">
          Passwords do not match
        </small>
      </div>

      <!-- Success Message -->
      <div class="success-banner" *ngIf="message">
        {{ message }}
      </div>

      <!-- Error Message -->
      <div class="error-banner" *ngIf="error">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn-register"
        [disabled]="isSubmitting || registerForm.invalid"
      >
        {{ isSubmitting ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
